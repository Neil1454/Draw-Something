name: Android build

on:
  push:            # every branch; pushes to main also publish a GitHub release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish a release when main is updated

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: draw-something-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (when main is updated)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          APK="TimeKillerGames-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Neil & Teri's Time Killer Games ${TAG}" \
              --notes "Download **${APK}** below on your Android phone or tablet and open it to install (allow installs from your browser or Files app when asked). Install it on both devices. Ideal for long flights: no internet needed. Made by Neil Sampson."
          fi
