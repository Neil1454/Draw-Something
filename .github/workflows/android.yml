name: Android build

on:
  push:            # every branch; pushes to main also publish a GitHub release
  pull_request:
  workflow_dispatch:

# Nothing can write to the repository unless a job below asks for it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release APK
        # The private signing key is only handed to builds of main. Branches and pull requests
        # (including ones from forks) never see it and sign with the public convenience key.
        env:
          KEYSTORE_B64: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.RELEASE_KEYSTORE_B64 || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.RELEASE_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Signing with the PRIVATE release key."
            KS="$RELEASE_KEYSTORE_FILE"; PASS="$RELEASE_KEYSTORE_PASSWORD"; ALIAS="$RELEASE_KEY_ALIAS"
          else
            echo "No private key available here: signing with the public convenience key."
            KS=app/debug.keystore; PASS=android; ALIAS=androiddebugkey
          fi
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

          # Check 1: the APK is signed with exactly the key we meant to use.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          EXPECTED=$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signing certificate SHA-256: $ACTUAL"
          echo "Expected key SHA-256:            $EXPECTED"
          test -n "$ACTUAL" && [ "$ACTUAL" = "$EXPECTED" ]

          # Check 2: a released app must not be debuggable.
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if "$AAPT2" dump badging "$APK" | grep -q 'application-debuggable'; then
            echo "ERROR: the release APK is marked debuggable"; exit 1
          fi

          # Package it under its final name, with the version beside it.
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp "$APK" "dist/TimeKillerGames-v${VERSION}.apk"
          echo "$VERSION" > dist/VERSION

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: time-killer-games-apk
          path: dist/

  release:
    # Publishing only happens when main is updated, and only this job may write to the repository.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: time-killer-games-apk
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat dist/VERSION)
          TAG="v${VERSION}"
          APK="dist/TimeKillerGames-v${VERSION}.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Neil & Teri's Time Killer Games ${TAG}" \
              --notes "Download **TimeKillerGames-v${VERSION}.apk** below on your Android phone or tablet and open it to install (allow installs from your browser or Files app when asked). Install it on both devices, or use the in-app Check for updates button. Ideal for long flights: no internet needed to play. Made by Neil Sampson."
          fi
