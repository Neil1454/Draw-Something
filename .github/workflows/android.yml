name: Android build

on:
  push:            # every branch, and version tags such as v1.1.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish a release when a version tag is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: draw-something-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="DrawSomething-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Draw Something ${GITHUB_REF_NAME}" \
            --notes "Download **${APK}** below on your Android phone or tablet and open it to install (allow installs from your browser or Files app when asked). Install it on both devices. Made by Neil Sampson."
